# Builds the SoyKB worker image, and publishes it when the change lands on
# master. The image tag encodes the job-executor version and the git describe
# output (je-1.4.1-v1.2.0-2-gf41e431), so a full-depth checkout is required.

name: soykb-worker

on:
  push:
    branches: [ master ]
    paths-ignore: [ 'README.md' ]
  pull_request:
    branches: [ master ]
    paths-ignore: [ 'README.md' ]
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built image to Docker Hub'
        type: boolean
        default: false

jobs:
  soykb-worker:
    runs-on: ubuntu-22.04
    # apk openjdk + clang toolchain, then FBAM is compiled from source.
    timeout-minutes: 60
    env:
      DO_PUSH: ${{ github.event_name == 'push' || inputs.push }}
      HAVE_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The Makefile derives the tag from `git describe --tags`; a shallow
          # clone silently degrades it to a bare commit sha.
          fetch-depth: 0

      - name: Show the tag the Makefile derives
        run: |
          git describe --tags --always
          make -n image | head -2

      - name: Login to Docker Hub
        if: env.HAVE_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        run: make image

      - name: Show built tags
        run: docker images 'hyperflowwms/soykb-worker'

      - name: Push
        if: env.DO_PUSH == 'true' && env.HAVE_DOCKERHUB == 'true'
        run: make push
